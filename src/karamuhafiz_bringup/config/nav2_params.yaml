# Hafta 3: Nav2 otonom sürüş parametreleri.
#
# ONEMLI MIMARI KARAR: AMCL ve map_server KULLANILMIYOR. Parkurun onceden
# taranmis bir haritasi (occupancy grid) yok. Bunun yerine Hafta 2'de
# kurdugumuz robot_localization cift-EKF'i (GPS+IMU+odometri) dogrudan
# map->odom->base_footprint TF zincirini sagliyor - bu, Nav2'nin resmi "GPS
# waypoint follower" ornegindeki standart, belgelenmis desendir. Hem global
# hem yerel costmap "rolling_window" (haritasiz, sensorden canli uretilen,
# robotla birlikte kayan pencere) olarak calisiyor.
#
# Arac RWD + on direksiyon (Ackermann) oldugu icin controller olarak
# nav2_regulated_pure_pursuit_controller secildi - bu, diferansiyel surus
# icin tasarlanmis DWB'nin aksine min_turning_radius kisitini destekliyor
# (arac yerinde donemiyor).
#
# NOT: Bu dosya simulasyonda CANLI TEST EDILMEDI - degerler standart Nav2
# varsayilanlari + aracin bilinen fiziksel olculeri (Hafta 1'den: wheelbase
# 1.10m, teker r 0.2575m, steer limiti +-0.6 rad) temel alinarak secildi.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.3
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # HATA DUZELTMESI (Hafta 3 canli test): "Lookup would require
      # extrapolation into the future" hatasi - global EKF'in odom->map TF'i
      # controller'in istedigi tam zamandan birkac ms geride kaliyordu
      # (yayinlama frekansi + islem gecikmesi kaynakli, kucuk ama varsayilan
      # tf2 toleransi bunu kabul etmiyordu). transform_tolerance ile makul
      # bir esneme payi taniniyor.
      transform_tolerance: 0.3
      desired_linear_vel: 1.0
      max_linear_accel: 1.0
      max_linear_decel: 1.5
      lookahead_dist: 1.5
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # Arac yerinde donemiyor (Ackermann) - gercek min donus yaricapi
      # wheelbase / tan(max_steer) = 1.10 / tan(0.6) ~ 1.57 m. Guvenlik payi
      # icin biraz buyuk verildi.
      use_rotate_to_heading: false
      use_fixed_curvature_lookahead: false
      min_turning_radius: 1.8
      # Egim/dar bolgelerde hiz dusurme (gorev sartnamesi gereksinimi):
      # yuksek egrilikte (keskin virajda) hizi otomatik azaltir.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.3
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # GECICI (Hafta 3 canli test): false yapildi. Namlu/taret donerken
      # bazen 0.35m filtre esiginin OTESINE (ornegin one dogru 0.4-0.5m)
      # uzanip LiDAR'a surekli "onde engel var" gibi gorunuyor, bu da
      # "RegulatedPurePursuitController detected collision ahead!" ile
      # her yol denemesini iptal ettiriyordu. Zincirin geri kalaninin
      # (TF, planlama, suruculuk) calistigini once kanitlamak icin
      # gecici olarak kapatildi - araç hareket ettigi DOGRULANINCA, daha
      # dogru bir cozumle (ornegin namlu acisina gore dinamik filtre veya
      # footprint'i namluyu da kapsayacak sekilde genisletme) TEKRAR
      # ACILMALI, bu olmadan Nav2'nin kendi engel onleme guvenligi devre disi!
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      update_frequency: 10.0
      publish_frequency: 5.0
      footprint: "[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]"
      plugins: ["obstacle_layer", "range_sensor_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # HATA DUZELTMESI (Hafta 3 canli test): Nav2'nin yerlesik "aracin
        # kendi ayak izini her zaman temiz tut" mekanizmasi - acikca
        # etkinlestirildi (varsayilani guvenceye almak icin).
        footprint_clearing_enabled: true
        observation_sources: "lidar"
        lidar:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: [
          "/sonar_corner_front_left", "/sonar_corner_front_right",
          "/sonar_corner_rear_left", "/sonar_corner_rear_right",
          "/sonar_rear_left", "/sonar_rear_right"
        ]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 1.0
        clear_threshold: 0.2
        mark_threshold: 0.8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.2
      update_frequency: 5.0
      publish_frequency: 2.0
      footprint: "[[0.75,0.5],[0.75,-0.5],[-0.75,-0.5],[-0.75,0.5]]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: "lidar"
        lidar:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
      # NOT: nav2_navfn_planner'in pluginlib kayit ismi "/" ile ayrilmis
      # formatta (paket/SinifAdi) - "::" (C++ namespace) formati DEGIL. Bu,
      # Hafta 3'teki canli testte (standalone configure) yakalanan gercek bir
      # hataydi: ilk yazilan "nav2_navfn_planner::NavfnPlanner" FATAL hatayla
      # cakiyordu. costmap katmanlari ve controller plugin'leri "::" formatini
      # kabul ediyor ama planner etmiyor - pakete gore degisen bir pluginlib
      # tutarsizligi.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    # NOT: planner_server'daki ayni hata burada da vardi ("::" degil "/" -
    # canli configure testinde yakalandi, duzeltildi).
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    # Dik/yan egimde veya dar bolgede guvenli manevra icin dusuk hiz limiti
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.2, 0.0, 0.6]
    min_velocity: [-0.5, 0.0, -0.6]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [
      "controller_server",
      "planner_server",
      "behavior_server",
      "bt_navigator",
      "waypoint_follower",
      "velocity_smoother"
    ]
