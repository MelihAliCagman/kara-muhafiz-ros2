# Global EKF: tekerlek odometrisi + IMU + GPS (navsat_transform'dan gelen
# /odometry/gps) -> map->odom TF. robot_localization'un standart "global EKF"
# rolu: GPS sayesinde odom suruklenmesini (drift) zaman icinde duzeltir.
# NOT: odom0/imu0 girdileri yerel EKF ile AYNI HAM SENSORLERDIR (yerel EKF'in
# SUZULMUS CIKTISI degil) - bu, robot_localization'in onerdigi standart cift-
# EKF deseni; iki filtre birbirinden bagimsiz calisir, yalnizca TF agacinin
# FARKLI kisimlarini (odom->base_footprint vs map->odom) yayinlarlar.
ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    odom0: /ackermann_steering_controller/odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # navsat_transform_node'un GPS'ten urettigi yerel kartezyen konum.
    # Yalnizca x,y fuse ediliyor (GPS yukseklik/yon bilgisi guvenilmez).
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

    use_control: false
